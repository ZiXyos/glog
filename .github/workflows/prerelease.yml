name: Pre-release

# Every merge to master that touches code cuts a new vX.Y.Z-rc.N pre-release.
# Its notes are generated by GitHub starting from the last *stable* tag, so each
# rc lists every pull request accumulated since the last real release. Promote
# the accumulation with the Release workflow when you are ready.
on:
  push:
    branches: [master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write

# Serialise with Release so a merge landing mid-promotion cannot race the tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  prerelease:
    name: Publish pre-release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag action reads the full tag history

      - name: Compute and push the next rc tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # master must NOT match release_branches, or this would cut a stable
          # tag instead of an rc. Stable tags are the Release workflow's job.
          release_branches: __none__
          pre_release_branches: master
          append_to_pre_release_tag: rc
          default_bump: patch
          custom_release_rules: qfix:patch:Bug Fixes

      - name: Publish the accumulated pre-release
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail

          # Newest plain vX.Y.Z tag; pre-releases carry a "-" and are skipped.
          stable=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          args=(--prerelease --generate-notes --title "$TAG")
          if [ -n "$stable" ]; then
            args+=(--notes-start-tag "$stable")
            echo "Accumulating every PR merged since $stable."
          else
            echo "No stable tag yet; notes cover the full history."
          fi

          gh release create "$TAG" "${args[@]}"
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
